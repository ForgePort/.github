version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps(actions)
