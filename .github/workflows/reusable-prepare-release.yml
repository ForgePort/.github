name: Reusable prepare BSL release PR
on:
  workflow_call:
    inputs:
      version:
        description: Version without v prefix, for example 0.0.1
        required: true
        type: string
      first-publication-date:
        description: Planned date in YYYY-MM-DD
        required: true
        type: string
      license-path:
        required: false
        default: LICENSE
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-preparation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main 2026-08-11
        with:
          persist-credentials: true
      - name: Validate and parameterize BSL
        shell: python
        env:
          VERSION: ${{ inputs.version }}
          FIRST_PUBLICATION: ${{ inputs.first-publication-date }}
          LICENSE_PATH: ${{ inputs.license-path }}
        run: |
          import datetime, os, pathlib, re
          version = os.environ["VERSION"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("version must be MAJOR.MINOR.PATCH without v")
          first = datetime.date.fromisoformat(os.environ["FIRST_PUBLICATION"])
          try:
              change = first.replace(year=first.year + 4)
          except ValueError as exc:
              raise SystemExit(
                  "the date exactly four calendar years later does not exist; "
                  "maintainer decision required"
              ) from exc
          workspace = pathlib.Path(".").resolve()
          path = pathlib.Path(os.environ["LICENSE_PATH"]).resolve()
          if workspace not in path.parents or ".git" in path.relative_to(workspace).parts:
              raise SystemExit("license path must stay inside the checked-out repository")
          text = path.read_text(encoding="utf-8")
          change_token = "CHANGE-DATE-" + "SET-AT-FIRST-PUBLICATION"
          publication_token = "FIRST-PUBLICATION-" + "DATE-SET-AT-RELEASE"
          if f"Change Date: {change_token}" not in text:
              raise SystemExit("unreleased Change Date token missing")
          if f"First Public Publication: {publication_token}" not in text:
              raise SystemExit("unreleased first-publication token missing")
          updated, count = re.subn(
              r"(?m)^(Licensed Work: .+?)\d+\.\d+\.\d+ \(unreleased\)$",
              rf"\g<1>{version}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("exact unreleased Licensed Work line missing")
          updated = updated.replace(
              f"First Public Publication: {publication_token}",
              f"First Public Publication: {first.isoformat()}",
              1,
          ).replace(
              f"Change Date: {change_token}",
              f"Change Date: {change.isoformat()}",
              1,
          )
          path.write_text(updated, encoding="utf-8")
      - name: Create review branch and pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FIRST_PUBLICATION: ${{ inputs.first-publication-date }}
          LICENSE_PATH: ${{ inputs.license-path }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="prepare-release/v${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "forgeport-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$LICENSE_PATH"
          git commit -m "chore(release): parameterize BSL for v${VERSION}"
          git push origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(release): prepare v${VERSION} BSL dates" \
            --body "Review required. Planned first public publication: ${FIRST_PUBLICATION}. The Change Date was calculated as exactly four calendar years later. Update and re-review this PR if the publication date moves. This PR does not create a tag or release."
