name: Prepare release license PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        type: string
      first-publication-date:
        description: Planned first public publication date (YYYY-MM-DD)
        required: true
        type: string
      license-path:
        description: Repository-relative BSL license path
        required: true
        default: LICENSE
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    uses: ./.github/workflows/reusable-prepare-release.yml
    with:
      version: ${{ inputs.version }}
      first-publication-date: ${{ inputs.first-publication-date }}
      license-path: ${{ inputs.license-path }}
